<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>컨베이어 정체 감지기 선택</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 24px; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { font-size: 13px; color: #888; margin-bottom: 32px; }
    .btn-container { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
    .mode-btn { display: flex; flex-direction: column; align-items: flex-start; padding: 18px 20px; border-radius: 12px; text-decoration: none; color: #fff; transition: transform 0.1s; }
    .mode-btn:active { transform: scale(0.98); }
    .btn-light { background: #007aff; }
    .btn-color { background: #34c759; }
    .btn-tilt { background: #ff9500; }
    .btn-title { font-size: 17px; font-weight: bold; margin-bottom: 4px; }
    .btn-desc { font-size: 12px; opacity: 0.85; text-align: left; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>컨베이어 감시 시스템</h1>
  <p>현장 라인 조건에 맞는 모드를 선택하세요</p>

  <div class="btn-container">
    <a href="light.html" class="mode-btn btn-light">
      <span class="btn-title">1. 밝기 감지 모드</span>
      <span class="btn-desc">검은색/짙은 벨트 + 흰색 박스용<br>(단순 명암 대비 감지)</span>
    </a>

    <a href="color.html" class="mode-btn btn-color">
      <span class="btn-title">2. 색상/픽셀 감지 모드</span>
      <span class="btn-desc">파란 벨트 + 파란 캡 등 동일 색상용<br>(테두리 질감 및 RGB 차분 감지)</span>
    </a>

    <a href="box_tilt.html" class="mode-btn btn-tilt">
      <span class="btn-title">3. 15x2 박스 전도(누움) 감지 모드</span>
      <span class="btn-desc">컨베이어 30개(15열×2단) 이송 박스 묶음 검사용<br>(1초 정지 감지 & 3초 쿨다운 락 & 코랩 AI 플러그앤플레이)</span>
    </a>
  </div>
</body>
</html>
