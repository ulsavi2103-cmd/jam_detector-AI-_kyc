<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>컨베이어 AI 자세/전도 검사기 (색상/픽셀 모드)</title>
  <!-- ONNX Runtime Web for Mobile Real-time AI Inspection -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #viewport-area {
      flex: 1;
      height: 100%;
      position: relative;
      background: #050608;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 16:9 와이드 종횡비 고정 래퍼 (가로/세로 모든 환경에서 16:9 비율 유지) */
    #stream-wrapper {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      height: auto;
      max-width: calc(100vh * (16 / 9));
      max-height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    /* object-fit: contain 으로 16:9 광범위 화각 100% 온전 노출 (좌우 잘림/크롭 원천 차단) */
    video, #sim-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    #sim-canvas { display: none; }

    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      touch-action: none;
      cursor: crosshair;
    }

    /* 모바일 세로 모드(Portrait) 반응형 분기: 상하 분할로 16:9 전폭 뷰포트 보장 */
    @media (orientation: portrait), (max-aspect-ratio: 1/1), (max-width: 768px) and (orientation: portrait), (max-width: 600px) {
      #app-container {
        flex-direction: column !important;
      }

      #viewport-area {
        flex: none !important;
        width: 100vw !important;
        height: auto !important;
        aspect-ratio: 16 / 9 !important;
        max-height: 46vh !important;
        background: #000;
      }

      #stream-wrapper {
        width: 100% !important;
        height: 100% !important;
        max-width: 100vw !important;
        max-height: calc(100vw * (9 / 16)) !important;
      }

      #sidebar {
        flex: 1 !important;
        width: 100vw !important;
        height: auto !important;
        border-left: none !important;
        border-top: 1px solid rgba(255, 255, 255, 0.12) !important;
        overflow-y: auto !important;
      }

      .mobile-rotate-hint {
        display: flex !important;
      }
    }

    /* 세로 모드 전용 가로 회전 권장 안내 배지 */
    .mobile-rotate-hint {
      position: absolute;
      bottom: 8px;
      right: 10px;
      z-index: 25;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #ffd700;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      display: none;
      align-items: center;
      gap: 5px;
      animation: pulseHint 2s infinite ease-in-out;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    /* 컨베이어 좌->우 주행 HUD 가이드 */
    #conveyor-flow-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(52, 199, 89, 0.4);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      color: #34c759;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .flow-arrow {
      animation: arrowSlide 1.2s infinite linear;
      font-size: 12px;
    }
    @keyframes arrowSlide {
      0% { transform: translateX(0); opacity: 0.4; }
      50% { transform: translateX(4px); opacity: 1; }
      100% { transform: translateX(8px); opacity: 0.4; }
    }

    #camera-status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      color: #fff;
      display: none;
      backdrop-filter: blur(8px);
    }

    #alarm-banner {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(220, 20, 40, 0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      text-align: center;
      animation: alertFlash 0.12s infinite alternate;
      pointer-events: none;
    }
    @keyframes alertFlash {
      from { opacity: 0.75; }
      to { opacity: 1; }
    }
    #alarm-title {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }
    #alarm-desc {
      font-size: 18px;
      font-weight: bold;
      color: #ffe6e6;
      margin-top: 8px;
      background: rgba(0,0,0,0.4);
      padding: 5px 16px;
      border-radius: 16px;
    }

    #sidebar {
      width: 220px;
      height: 100%;
      background: rgba(14, 16, 22, 0.96);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      overflow-y: auto;
      z-index: 50;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .system-title {
      font-size: 12px;
      font-weight: 800;
      color: #34c759;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      background: #333;
      color: #aaa;
      font-weight: bold;
    }
    .badge-running { background: rgba(52, 199, 89, 0.2); color: #34c759; border: 1px solid #34c759; }
    .badge-defect { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid #ff3b30; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    button {
      padding: 9px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: opacity 0.1s;
    }
    button:active { opacity: 0.8; }
    #btn-toggle { background: #34c759; color: #000; font-weight: 900; }
    #btn-inject-defect { background: #ff9500; font-size: 11px; }
    #btn-sim-mode { background: #2c2c2e; border: 1px solid #444; font-size: 10px; }

    .roi-panel {
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .roi-title {
      font-size: 10px;
      color: #888;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
    }
    .control-row label { color: #aaa; width: 60px; }
    .control-row input[type="range"] { flex: 1; margin: 0 4px; }
    .val-badge { width: 30px; text-align: right; color: #34c759; font-weight: bold; }

    .log-panel {
      flex: 1;
      min-height: 100px;
      background: #06070a;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px;
      display: flex;
      flex-direction: column;
    }
    .log-title {
      font-size: 10px;
      color: #888;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    #log-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 10px;
      font-family: monospace;
    }
    .log-item {
      padding: 3px 5px;
      border-radius: 3px;
      background: rgba(255,255,255,0.03);
      display: flex;
      justify-content: space-between;
    }
    .log-item.defect {
      background: rgba(255, 59, 48, 0.25);
      border-left: 2px solid #ff3b30;
      color: #ff9090;
      font-weight: bold;
    }
    .log-item.normal {
      border-left: 2px solid #34c759;
      color: #a0ffa0;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="viewport-area">
      <div id="stream-wrapper">
        <video id="v" playsinline webkit-playsinline autoplay muted></video>
        <canvas id="sim-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>

        <div id="conveyor-flow-badge">
          <span>컨베이어 주행: 좌 ➔ 우</span>
          <span class="flow-arrow">▶▶▶</span>
        </div>

        <div id="camera-status">카메라 초기화 중...</div>

        <div id="alarm-banner">
          <div id="alarm-title">🚨 불량 자세(전도) 감지!</div>
          <div id="alarm-desc">상자가 가로로 누웠습니다. 즉시 정지하세요!</div>
        </div>

        <div id="rotate-hint" class="mobile-rotate-hint">
          <span>🔄 가로 회전 시 16:9 와이드 전체화면</span>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div class="panel-header">
        <span class="system-title">색상/픽셀 AI 검사</span>
        <span class="status-badge" id="badge-status">대기</span>
      </div>

      <div class="btn-group">
        <button id="btn-toggle">▶ 검사 시작</button>
        <button id="btn-inject-defect">⚠️ 불량 모의 주입 (키 'T')</button>
        <button id="btn-sim-mode">🎮 가상 컨베이어 모드: OFF</button>
      </div>

      <div class="roi-panel">
        <div class="roi-title">
          <span>ROI (화면 터치/드래그 이동)</span>
          <span id="roi-coords">X:300 W:100</span>
        </div>
        <div class="control-row">
          <label>RGB 감도</label>
          <input type="range" id="rng-sens" min="5" max="50" step="1" value="15">
          <span class="val-badge" id="txt-sens">15</span>
        </div>
        <div class="control-row">
          <label>영역 가로(W)</label>
          <input type="range" id="rng-w" min="40" max="250" step="5" value="100">
          <span class="val-badge" id="txt-w">100</span>
        </div>
        <div class="control-row">
          <label>영역 세로(H)</label>
          <input type="range" id="rng-h" min="60" max="450" step="5" value="280">
          <span class="val-badge" id="txt-h">280</span>
        </div>
        <div class="control-row">
          <label>가로 위치(X)</label>
          <input type="range" id="rng-x" min="0" max="500" step="5" value="300">
          <span class="val-badge" id="txt-x">300</span>
        </div>
      </div>

      <div class="log-panel">
        <div class="log-title">
          <span>실시간 판독 이력</span>
          <span id="txt-stat-count">0건</span>
        </div>
        <div id="log-list"></div>
      </div>
    </div>
  </div>

  <script>
    const v = document.getElementById('v');
    const simCanvas = document.getElementById('sim-canvas');
    const simCtx = simCanvas.getContext('2d');
    const overlay = document.getElementById('overlay-canvas');
    const octx = overlay.getContext('2d');
    const banner = document.getElementById('alarm-banner');
    const alarmTitle = document.getElementById('alarm-title');
    const alarmDesc = document.getElementById('alarm-desc');
    const badgeStatus = document.getElementById('badge-status');
    const logList = document.getElementById('log-list');
    const statCount = document.getElementById('txt-stat-count');
    const roiCoords = document.getElementById('roi-coords');
    const cameraStatus = document.getElementById('camera-status');

    const btnToggle = document.getElementById('btn-toggle');
    const btnInjectDefect = document.getElementById('btn-inject-defect');
    const btnSimMode = document.getElementById('btn-sim-mode');

    const rngSens = document.getElementById('rng-sens'), txtSens = document.getElementById('txt-sens');
    const rngW = document.getElementById('rng-w'), txtW = document.getElementById('txt-w');
    const rngH = document.getElementById('rng-h'), txtH = document.getElementById('txt-h');
    const rngX = document.getElementById('rng-x'), txtX = document.getElementById('txt-x');

    let audioCtx = null;
    let isRunning = false;
    let isSimMode = false;
    let totalInspected = 0;

    const BASE_W = 640;
    const BASE_H = 360;
    overlay.width = BASE_W;
    overlay.height = BASE_H;
    simCanvas.width = BASE_W;
    simCanvas.height = BASE_H;

    let roi = {
      x: 300,
      y: 40,
      w: 100,
      h: 280
    };
    let sensitivity = 15;

    let isBoxPresent = false;
    let boxPresentTime = 0;
    let alarmTimer = null;

    window.testDefectTrigger = false;

    // 터치 좌표 1:1 매핑
    let isDraggingRoi = false;
    let dragOffset = { x: 0, y: 0 };

    function getTouchPos(e) {
      const rect = overlay.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = BASE_W / rect.width;
      const scaleY = BASE_H / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function isInsideRoi(pos) {
      return pos.x >= roi.x && pos.x <= roi.x + roi.w &&
             pos.y >= roi.y && pos.y <= roi.y + roi.h;
    }

    function onPointerDown(e) {
      const pos = getTouchPos(e);
      if (isInsideRoi(pos)) {
        isDraggingRoi = true;
        dragOffset.x = pos.x - roi.x;
        dragOffset.y = pos.y - roi.y;
      }
    }

    function onPointerMove(e) {
      if (!isDraggingRoi) return;
      const pos = getTouchPos(e);
      roi.x = Math.max(0, Math.min(BASE_W - roi.w, pos.x - dragOffset.x));
      roi.y = Math.max(0, Math.min(BASE_H - roi.h, pos.y - dragOffset.y));
      rngX.value = Math.round(roi.x);
      txtX.textContent = Math.round(roi.x);
      updateRoiText();
    }

    function onPointerUp() {
      isDraggingRoi = false;
    }

    overlay.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    overlay.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    function updateRoiText() {
      roiCoords.textContent = `X:${Math.round(roi.x)} W:${roi.w}`;
    }

    rngSens.oninput = () => { sensitivity = parseInt(rngSens.value); txtSens.textContent = sensitivity; };
    rngW.oninput = () => { roi.w = parseInt(rngW.value); txtW.textContent = roi.w; updateRoiText(); };
    rngH.oninput = () => { roi.h = parseInt(rngH.value); txtH.textContent = roi.h; updateRoiText(); };
    rngX.oninput = () => { roi.x = parseInt(rngX.value); txtX.textContent = roi.x; updateRoiText(); };

    // 모바일 카메라 재생 보장
    async function startCamera() {
      cameraStatus.style.display = "block";
      cameraStatus.textContent = "📷 후면 카메라 연결 중...";

      v.muted = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.setAttribute('autoplay', '');
      v.setAttribute('muted', '');

      // 1. 카메라 16:9 광범위 와이드 해상도 제약 조건 (스마트폰 16:9 와이드 화각 우선 탑재)
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280, min: 640 },
          height: { ideal: 720, min: 360 },
          aspectRatio: { ideal: 1.777777778 }
        },
        audio: false
      };

      const constraintsList = [
        constraints,
        {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            aspectRatio: { ideal: 16 / 9 }
          }
        },
        {
          audio: false,
          video: {
            facingMode: "environment",
            width: { ideal: 640 },
            height: { ideal: 360 }
          }
        },
        { audio: false, video: { facingMode: "environment" } },
        { audio: false, video: true }
      ];

      let stream = null;
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        for (const c of constraintsList) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(c);
            if (stream) break;
          } catch (e) {
            console.warn("Camera constraint fallback:", e);
          }
        }
      }

      if (stream) {
        v.srcObject = stream;
        v.onloadedmetadata = async () => {
          try {
            await v.play();
            cameraStatus.style.display = "none";
            v.style.display = "block";
            simCanvas.style.display = "none";
            console.log("✔ 카메라 스트림 재생 성공:", v.videoWidth, "x", v.videoHeight);
          } catch (err) {
            console.error("Video play block:", err);
            cameraStatus.innerHTML = "▶ 화면을 터치하면 카메라가 켜집니다";
            const unlockPlay = () => {
              v.play().then(() => { cameraStatus.style.display = "none"; });
              window.removeEventListener('click', unlockPlay);
              window.removeEventListener('touchstart', unlockPlay);
            };
            window.addEventListener('click', unlockPlay);
            window.addEventListener('touchstart', unlockPlay);
          }
        };
      } else {
        cameraStatus.innerHTML = "⚠️ 카메라를 열 수 없습니다<br><span style='font-size:11px'>[가상 컨베이어 모드]로 자동 전환합니다</span>";
        setTimeout(() => {
          setSimMode(true);
          cameraStatus.style.display = "none";
        }, 1200);
      }
    }
    startCamera();

    function setSimMode(on) {
      isSimMode = on;
      if (isSimMode) {
        btnSimMode.textContent = "🎮 가상 컨베이어 모드: ON";
        btnSimMode.style.background = "#34c759";
        btnSimMode.style.color = "#000";
        v.style.display = 'none';
        simCanvas.style.display = 'block';
      } else {
        btnSimMode.textContent = "🎮 가상 컨베이어 모드: OFF";
        btnSimMode.style.background = "#2c2c2e";
        btnSimMode.style.color = "#fff";
        v.style.display = 'block';
        simCanvas.style.display = 'none';
      }
    }
    window.setSimMode = setSimMode;
    btnSimMode.onclick = () => setSimMode(!isSimMode);

    // 가상 컨베이어 (좌 -> 우)
    let simBoxes = [];
    let nextSpawnTime = 0;

    function updateSimulation(now) {
      simCtx.fillStyle = "#161b22";
      simCtx.fillRect(0, 0, BASE_W, BASE_H);

      simCtx.fillStyle = "#0d1f2d";
      simCtx.fillRect(0, 40, BASE_W, 280);
      simCtx.strokeStyle = "#1b3a4b";
      simCtx.lineWidth = 2;
      simCtx.strokeRect(0, 40, BASE_W, 280);

      if (now > nextSpawnTime) {
        const isToppled = window.testDefectTrigger;
        if (isToppled) window.testDefectTrigger = false;
        simBoxes.push({
          x: -120,
          y: isToppled ? 140 : 60,
          w: isToppled ? 140 : 60,
          h: isToppled ? 60 : 240,
          toppled: isToppled,
          passed: false
        });
        nextSpawnTime = now + 2000;
      }

      for (let i = simBoxes.length - 1; i >= 0; i--) {
        const b = simBoxes[i];
        b.x += 4.5;

        simCtx.fillStyle = b.toppled ? "#d97706" : "#2563eb";
        simCtx.fillRect(b.x, b.y, b.w, b.h);
        simCtx.strokeStyle = "#93c5fd";
        simCtx.lineWidth = 2;
        simCtx.strokeRect(b.x, b.y, b.w, b.h);

        simCtx.fillStyle = "#fff";
        simCtx.font = "bold 11px sans-serif";
        simCtx.fillText(b.toppled ? "누움(불량)" : "정상", b.x + 6, b.y + 22);

        if (b.x > BASE_W + 150) {
          simBoxes.splice(i, 1);
        }
      }
    }

    // =========================================================================
    // 5. ONNX Runtime & Zero-Allocation Buffer (Mobile OOM & GC 부하 완전 차단)
    // =========================================================================
    const MODEL_PATH = 'models/box_posture_model.onnx';
    const MODEL_INPUT_SHAPE = [1, 3, 128, 128];
    const INPUT_SIZE = 128;
    const INPUT_PIXELS = INPUT_SIZE * INPUT_SIZE; // 16,384

    // [핵심] 전역 스코프에 1*3*128*128 크기 고정 버퍼 1개만 할당 (매 루프마다 new Float32Array 생성 금지)
    const inputTensorBuffer = new Float32Array(1 * 3 * INPUT_SIZE * INPUT_SIZE); // 49,152 floats

    // 전처리 전용 단일 재사용 Canvas/Context (가비지 컬렉터 부하 방지)
    const prepCanvas = document.createElement('canvas');
    prepCanvas.width = INPUT_SIZE;
    prepCanvas.height = INPUT_SIZE;
    const prepCtx = prepCanvas.getContext('2d', { willReadFrequently: true });

    // ImageNet 정규화 상수: Mean [0.485, 0.456, 0.406], Std [0.229, 0.224, 0.225]
    const MEAN_R = 0.485, MEAN_G = 0.456, MEAN_B = 0.406;
    const STD_R = 0.229, STD_G = 0.224, STD_B = 0.225;

    let ortSession = null;
    let isModelLoading = false;

    async function initOnnxModel() {
      if (typeof ort === 'undefined') {
        console.warn("[ONNX] ort library not loaded, using fallback/simulation mode.");
        return;
      }
      isModelLoading = true;
      try {
        // 모바일 안정성을 위해 executionProviders: ['wasm'] 우선 적용
        const options = { executionProviders: ['wasm'] };
        try {
          ortSession = await ort.InferenceSession.create(MODEL_PATH, options);
          console.log("✔ [ONNX] models/box_posture_model.onnx WASM 세션 초기화 성공");
        } catch (e1) {
          ortSession = await ort.InferenceSession.create('box_posture_model.onnx', options);
          console.log("✔ [ONNX] box_posture_model.onnx WASM 세션 초기화 성공");
        }
      } catch (err) {
        console.warn("⚠️ [ONNX] 모델 가중치 파일 로드 대기 (시뮬레이션/더미 모드로 자동 폴백):", err.message);
      } finally {
        isModelLoading = false;
      }
    }
    initOnnxModel();

    /**
     * ImageNet Mean/Std 정규화 및 NCHW 레이아웃 준수 In-place 업데이트 함수
     * 함수 내부에서 new Float32Array()를 생성하지 않고 기존 inputTensorBuffer를 덮어씀 (Zero-Allocation)
     */
    function preprocessCropToBuffer(sourceCanvasOrVideo, cropX, cropY, cropW, cropH) {
      prepCtx.drawImage(sourceCanvasOrVideo, cropX, cropY, cropW, cropH, 0, 0, INPUT_SIZE, INPUT_SIZE);
      const imgData = prepCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
      const data = imgData.data; // RGBA uint8 (128*128*4)

      const offsetG = INPUT_PIXELS;
      const offsetB = INPUT_PIXELS * 2;

      // NCHW 레이아웃: R 채널(0..16383), G 채널(16384..32767), B 채널(32768..49151)
      for (let i = 0; i < INPUT_PIXELS; i++) {
        const px = i * 4;
        const r = data[px] / 255.0;
        const g = data[px + 1] / 255.0;
        const b = data[px + 2] / 255.0;

        // ImageNet 공식: (val - mean) / std
        inputTensorBuffer[i] = (r - MEAN_R) / STD_R;
        inputTensorBuffer[offsetG + i] = (g - MEAN_G) / STD_G;
        inputTensorBuffer[offsetB + i] = (b - MEAN_B) / STD_B;
      }
      return inputTensorBuffer;
    }

    /**
     * MobileNetV3 ONNX 모델 추론 & 폴백 인터페이스: inspect_box_posture
     * 클래스 인덱스 매핑: 0: defect, 1: normal
     */
    async function inspect_box_posture(sourceCanvasOrVideo, cropX, cropY, cropW, cropH) {
      if (window.testDefectTrigger) {
        window.testDefectTrigger = false;
        return { is_defect: true, label: "TOPPLED (가로 누움 불량)", confidence: 0.98 };
      }

      if (isSimMode) {
        const currentBox = simBoxes.find(b => b.x + b.w > cropX && b.x < cropX + cropW);
        if (currentBox && currentBox.toppled) {
          return { is_defect: true, label: "TOPPLED (가로 누움 불량)", confidence: 0.96 };
        }
      }

      if (ortSession) {
        try {
          preprocessCropToBuffer(sourceCanvasOrVideo, cropX, cropY, cropW, cropH);
          const inputTensor = new ort.Tensor('float32', inputTensorBuffer, MODEL_INPUT_SHAPE);
          const feeds = {};
          feeds[ortSession.inputNames[0]] = inputTensor;
          const results = await ortSession.run(feeds);
          const output = results[ortSession.outputNames[0]];
          const outData = output.data;

          const scoreDefect = outData[0];
          const scoreNormal = outData[1];

          // Softmax 정규화
          const maxVal = Math.max(scoreDefect, scoreNormal);
          const exp0 = Math.exp(scoreDefect - maxVal);
          const exp1 = Math.exp(scoreNormal - maxVal);
          const probDefect = exp0 / (exp0 + exp1);
          const probNormal = exp1 / (exp0 + exp1);

          // 클래스 인덱스 매핑: 0: defect, 1: normal
          const isDefect = probDefect > probNormal;
          return {
            is_defect: isDefect,
            label: isDefect ? "DEFECT (자세 불량)" : "NORMAL (정상 직립)",
            confidence: isDefect ? probDefect : probNormal
          };
        } catch (err) {
          console.warn("[ONNX] 추론 실행 오류 (폴백 모드 전환):", err);
        }
      }

      return { is_defect: false, label: "NORMAL (정상 직립)", confidence: 0.99 };
    }

    function soundAlert() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {
        console.warn("AudioContext 오류:", e);
      }
    }

    function triggerDefectAlarm(label, conf) {
      alarmTitle.textContent = "🚨 불량 자세(전도) 감지!";
      alarmDesc.textContent = `${label} (신뢰도 ${(conf * 100).toFixed(0)}%)`;
      banner.style.display = 'flex';
      badgeStatus.textContent = "🚨 불량 감지";
      badgeStatus.className = "status-badge badge-defect";

      soundAlert();

      clearTimeout(alarmTimer);
      alarmTimer = setTimeout(() => {
        banner.style.display = 'none';
        if (isRunning) {
          badgeStatus.textContent = "감시 중";
          badgeStatus.className = "status-badge badge-running";
        }
      }, 1500);

      addLog(label, true, conf);
    }

    function triggerJamAlarm() {
      alarmTitle.textContent = "🚨 라인 정체(Jam) 발생!";
      alarmDesc.textContent = "상자가 2초 이상 통과 구역에 멈춰 있습니다";
      banner.style.display = 'flex';
      badgeStatus.textContent = "🚨 정체 발생";
      badgeStatus.className = "status-badge badge-defect";
      soundAlert();
    }

    function addLog(label, isDefect, conf) {
      totalInspected++;
      statCount.textContent = `${totalInspected}건`;
      const timeStr = new Date().toTimeString().split(' ')[0];
      const item = document.createElement('div');
      item.className = `log-item ${isDefect ? 'defect' : 'normal'}`;
      item.innerHTML = `
        <span>[${timeStr}] ${label}</span>
        <span>${(conf * 100).toFixed(0)}%</span>
      `;
      logList.insertBefore(item, logList.firstChild);
      if (logList.children.length > 30) logList.removeChild(logList.lastChild);
    }

    let offscreenC = document.createElement('canvas');
    offscreenC.width = BASE_W;
    offscreenC.height = BASE_H;
    let offCtx = offscreenC.getContext('2d', { willReadFrequently: true });

    let cropCanvas = document.createElement('canvas');
    let cropCtx = cropCanvas.getContext('2d');

    let prevPixels = null;

    function getRoiColorDelta() {
      const src = isSimMode ? simCanvas : v;
      if (!isSimMode && (!v.videoWidth || !v.videoHeight)) return 0;

      offCtx.drawImage(src, 0, 0, BASE_W, BASE_H);
      const imgData = offCtx.getImageData(roi.x, roi.y, roi.w, roi.h);
      const data = imgData.data;

      if (!prevPixels || prevPixels.length !== data.length) {
        prevPixels = new Uint8ClampedArray(data);
        return 0;
      }

      let diffSum = 0;
      const step = 8;
      let count = 0;
      for (let i = 0; i < data.length; i += step * 4) {
        const dr = Math.abs(data[i] - prevPixels[i]);
        const dg = Math.abs(data[i + 1] - prevPixels[i + 1]);
        const db = Math.abs(data[i + 2] - prevPixels[i + 2]);
        diffSum += (dr + dg + db) / 3;
        count++;
      }

      for (let i = 0; i < data.length; i += 16) {
        prevPixels[i] = (prevPixels[i] * 0.9 + data[i] * 0.1);
        prevPixels[i + 1] = (prevPixels[i + 1] * 0.9 + data[i + 1] * 0.1);
        prevPixels[i + 2] = (prevPixels[i + 2] * 0.9 + data[i + 2] * 0.1);
      }

      return diffSum / count;
    }

    // 3. 고속 통과(0.6초 주기) 및 디바운스 파라미터 (유효 체류 200~300ms 최적화)
    const CHECK_INTERVAL = 100; // 추론 호출 주기 (100ms)
    const COOLDOWN_TIME = 400;  // 판정 쿨다운 (400ms)

    window.inputTensorBuffer = inputTensorBuffer;
    window.CHECK_INTERVAL = CHECK_INTERVAL;
    window.COOLDOWN_TIME = COOLDOWN_TIME;
    window.preprocessCropToBuffer = preprocessCropToBuffer;
    window.inspect_box_posture = inspect_box_posture;

    let lastCheckTime = 0;
    let lastJudgmentTime = 0;
    let isCooldown = false;
    let isInferring = false;

    let lastLoopTime = performance.now();

    function renderLoop(now) {
      const dt = (now - lastLoopTime) / 1000;
      lastLoopTime = now;

      if (isSimMode) updateSimulation(now);

      octx.clearRect(0, 0, BASE_W, BASE_H);

      octx.lineWidth = 3;
      octx.setLineDash(isBoxPresent ? [] : [6, 4]);
      octx.strokeStyle = isBoxPresent ? "#ffcc00" : "#34c759";
      octx.strokeRect(roi.x, roi.y, roi.w, roi.h);
      octx.setLineDash([]);

      octx.fillStyle = isBoxPresent ? "rgba(255, 204, 0, 0.18)" : "rgba(52, 199, 89, 0.08)";
      octx.fillRect(roi.x, roi.y, roi.w, roi.h);

      octx.fillStyle = "#34c759";
      octx.font = "bold 11px sans-serif";
      octx.fillText("▶ AI 통과선 [좌➔우]", roi.x + 4, roi.y + 16);

      // 쿨다운 상태 자동 해제 검사 (400ms 경과 시)
      if (isCooldown && (now - lastJudgmentTime >= COOLDOWN_TIME)) {
        isCooldown = false;
      }

      if (isRunning) {
        // 100ms 주기 추론 호출 (CHECK_INTERVAL)
        if (now - lastCheckTime >= CHECK_INTERVAL) {
          lastCheckTime = now;

          let presentNow = false;
          if (isSimMode) {
            presentNow = simBoxes.some(b => b.x + b.w > roi.x && b.x < roi.x + roi.w);
          } else {
            const delta = getRoiColorDelta();
            presentNow = delta >= sensitivity;
          }

          if (presentNow) {
            boxPresentTime += (CHECK_INTERVAL / 1000);
            isBoxPresent = true;

            // 쿨다운 중이 아니고 현재 비동기 추론 중이 아닐 때만 1회 판정 수행 (동일 제품 중복 카운트 방지)
            if (!isCooldown && !isInferring) {
              isInferring = true;
              isCooldown = true;
              lastJudgmentTime = now;

              const src = isSimMode ? simCanvas : v;
              inspect_box_posture(src, roi.x, roi.y, roi.w, roi.h).then(result => {
                isInferring = false;
                if (result.is_defect) {
                  triggerDefectAlarm(result.label, result.confidence);
                } else {
                  addLog(result.label, false, result.confidence);
                }
              }).catch(err => {
                isInferring = false;
                console.error("Inference error:", err);
              });
            }

            // 라인 정체(Jam) 감지 (2초 이상 통과 구역 멈춤 시)
            if (boxPresentTime >= 2.0 && banner.style.display !== 'flex') {
              triggerJamAlarm();
            }
          } else {
            isBoxPresent = false;
            boxPresentTime = 0;
          }
        }
      }

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    btnToggle.onclick = () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      isRunning = !isRunning;
      if (isRunning) {
        btnToggle.textContent = "⏹ 검사 중지";
        btnToggle.style.background = "#ff3b30";
        btnToggle.style.color = "#fff";
        badgeStatus.textContent = "감시 중";
        badgeStatus.className = "status-badge badge-running";
      } else {
        btnToggle.textContent = "▶ 검사 시작";
        btnToggle.style.background = "#34c759";
        btnToggle.style.color = "#000";
        badgeStatus.textContent = "대기";
        badgeStatus.className = "status-badge";
        banner.style.display = 'none';
        isBoxPresent = false;
        boxPresentTime = 0;
        isCooldown = false;
        isInferring = false;
      }
    };

    function injectDefect() {
      window.testDefectTrigger = true;
      isCooldown = false; // 테스트 모의 주입 시 쿨다운 즉시 해제
      btnInjectDefect.style.background = "#ff3b30";
      setTimeout(() => btnInjectDefect.style.background = "#ff9500", 600);
      if (isSimMode) {
        const approaching = simBoxes.find(b => b.x < roi.x && b.x + b.w > 0);
        if (approaching) {
          approaching.toppled = true;
          approaching.w = 140;
          approaching.h = 60;
          approaching.y = 140;
        } else {
          simBoxes.push({
            x: roi.x - 80,
            y: 140,
            w: 140,
            h: 60,
            toppled: true,
            passed: false
          });
        }
      }
      console.log("[TEST] 불량(누움) 모의 주입 활성화 완료");
    }

    btnInjectDefect.onclick = injectDefect;

    window.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T' || e.code === 'KeyT' || e.key === 'KeyT') {
        injectDefect();
      }
    });
  </script>
</body>
