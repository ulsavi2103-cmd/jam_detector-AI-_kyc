<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3x10 이송 박스 전도(누움) 실시간 감지기</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #141721;
      --accent: #ff9500;
      --accent-glow: rgba(255, 149, 0, 0.25);
      --success: #34c759;
      --danger: #ff3b30;
      --text: #f5f5f7;
      --text-dim: #8e8e93;
      --border: #2c2f3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 */
    header {
      padding: 8px 14px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    h1 { font-size: 15px; font-weight: 700; color: #fff; }
    .cv-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #2a2a2e;
      color: #aaa;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .cv-badge.ready { background: rgba(52, 199, 89, 0.2); color: var(--success); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* 메인 뷰포트 (화면 최대화 및 1:1 정합 래퍼) */
    #viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }
    #video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video, #sim-canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    #sim-canvas { display: none; }
    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }

    /* 플로팅 배지 및 썸네일 */
    #state-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(20, 23, 33, 0.88);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 18px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 25;
    }
    #template-thumb-box {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(20, 23, 33, 0.88);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      z-index: 25;
    }
    #thumb-canvas {
      width: 38px;
      height: 38px;
      background: #000;
      border: 1px solid #444;
      border-radius: 4px;
    }
    .thumb-label { font-size: 9px; color: var(--text-dim); }

    /* 세로모드 회전 안내 배너 */
    #orientation-hint {
      display: none;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 23, 33, 0.94);
      border: 1.5px solid var(--accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      padding: 7px 14px;
      border-radius: 18px;
      z-index: 28;
      text-align: center;
      pointer-events: none;
      animation: floatPrompt 1.2s infinite alternate ease-in-out;
    }
    @keyframes floatPrompt {
      from { transform: translateX(-50%) translateY(0); }
      to { transform: translateX(-50%) translateY(-4px); }
    }
    .hint-title { font-size: 12px; font-weight: 800; color: var(--accent); }
    .hint-desc { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
    @media (orientation: portrait) {
      #orientation-hint { display: block; }
    }

    /* 알람 팝업 배너 */
    #alarm-banner {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 59, 48, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      text-align: center;
      padding: 20px;
      animation: alertPulse 0.3s infinite alternate;
    }
    #alarm-banner button {
      flex: 0 0 auto !important;
      height: 42px;
      min-width: 160px;
      padding: 0 20px;
      background: #fff;
      color: #000;
      font-size: 13px;
      font-weight: 800;
      border-radius: 8px;
      margin-top: 16px;
    }
    @keyframes alertPulse { from { opacity: 0.85; } to { opacity: 1; } }
    .alarm-title { font-size: 26px; font-weight: 900; }
    .alarm-sub { font-size: 14px; margin-top: 6px; opacity: 0.95; }

    /* 하단 컨트롤 패널 & HUD 독(Dock) */
    #controls {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 8px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      flex-shrink: 0;
      max-height: 45vh;
      overflow-y: auto;
    }
    .stat-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      background: rgba(0,0,0,0.25);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .stat-val { font-weight: bold; color: #fff; }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 100px;
      padding: 10px 8px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-open-settings { background: #3a3a3c; }
    #btn-sim-mode { background: #2c2f3e; }
    #btn-sim-mode.active { background: #007aff; }
    #btn-capture-template { background: #2c2f3e; }
    #btn-capture-template:hover:not(:disabled) { background: #3a3e52; }
    #btn-inspect-now { background: #5856d6; }
    #btn-inspect-now:hover:not(:disabled) { background: #6b69e8; }
    #btn-toggle-run { background: var(--accent); }
    #btn-toggle-run.running { background: var(--danger); }

    /* 상세 설정 드로어 (모달 팝업) */
    #settings-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 120;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #settings-card {
      background: #181b26;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 540px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .modal-head h2 { font-size: 15px; font-weight: 800; color: var(--accent); }
    .btn-close-modal {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      min-width: auto;
      padding: 4px 8px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px 16px;
    }
    .control-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      gap: 6px;
    }
    .control-item label { color: var(--text-dim); width: 85px; flex-shrink: 0; white-space: nowrap; }
    .control-item input[type="range"] {
      flex: 1;
      min-width: 60px;
      accent-color: var(--accent);
    }
    .val-badge {
      width: 48px;
      text-align: right;
      font-weight: bold;
      color: var(--accent);
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* === 모바일 가로모드 (Landscape) 전용 HUD 레이아웃 혁신 === */
    @media (orientation: landscape) {
      header {
        position: absolute;
        top: 0; left: 0; width: 100%;
        background: rgba(20, 23, 33, 0.7);
        backdrop-filter: blur(8px);
        padding: 4px 12px;
        z-index: 40;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      h1 { font-size: 12px; }
      #state-badge { top: 38px; left: 10px; font-size: 10px; padding: 3px 8px; }
      #template-thumb-box { top: 38px; right: 10px; padding: 2px; }
      #thumb-canvas { width: 32px; height: 32px; }

      /* 가로모드에서는 하단 패널을 플로팅 슬림 HUD 바 형태로 변환 */
      #controls {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 720px;
        background: rgba(20, 23, 33, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 5px 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        max-height: none;
        z-index: 40;
      }
      .stat-bar {
        padding: 2px 6px;
        font-size: 10px;
        background: transparent;
        border: none;
      }
      .btn-row {
        gap: 4px;
        margin-top: 2px;
      }
      button {
        padding: 8px 6px;
        font-size: 11px;
        min-width: 80px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <a href="index.html" class="back-btn">‹ 메뉴</a>
      <h1>3x10 박스 전도(누움) 실시간 감지</h1>
    </div>
    <div id="cv-status" class="cv-badge">
      <span class="dot"></span>
      <span id="cv-text">OpenCV.js 로딩중...</span>
    </div>
  </header>

  <div id="viewport">
    <div id="video-wrapper">
      <video id="webcam" playsinline autoplay muted></video>
      <canvas id="sim-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
    </div>

    <div id="orientation-hint">
      <div class="hint-title">🔄 스마트폰을 가로로 돌려주세요</div>
      <div class="hint-desc">3x10 전체 영역이 가로 화면에 완벽하게 일치합니다</div>
    </div>

    <div id="state-badge">
      <span class="dot" style="background: #00ffcc;"></span>
      <span id="state-text">대기 (STOPPED)</span>
    </div>

    <div id="template-thumb-box">
      <canvas id="thumb-canvas" width="60" height="60"></canvas>
      <span id="thumb-status" class="thumb-label">기준 미등록</span>
    </div>

    <div id="alarm-banner">
      <div class="alarm-title">🚨 전도(누움) 박스 불량 감지!</div>
      <div class="alarm-sub" id="alarm-detail">2행 5열, 3행 2열 불량 의심</div>
      <button id="btn-dismiss-alarm">확인 / 경보 해제</button>
    </div>
  </div>

  <div id="controls">
    <div class="stat-bar">
      <span>모션: <span id="txt-motion" class="stat-val">0.0</span></span>
      <span>결과: <span id="txt-inspect-result" class="stat-val">대기중</span></span>
      <span>일치율: <span id="txt-min-score" class="stat-val">-</span></span>
    </div>

    <div class="btn-row">
      <button id="btn-open-settings">⚙️ 설정</button>
      <button id="btn-sim-mode">🎮 시뮬레이션</button>
      <button id="btn-capture-template" disabled>📸 정상 캡처</button>
      <button id="btn-inspect-now" disabled>⚡ 1회 검사</button>
      <button id="btn-toggle-run" disabled>▶️ 자동 감시</button>
    </div>
  </div>

  <!-- 상세 설정 모달 드로어 -->
  <div id="settings-modal">
    <div id="settings-card">
      <div class="modal-head">
        <h2>⚙️ 격자 및 감도 상세 설정</h2>
        <button class="btn-close-modal" id="btn-close-settings">✕</button>
      </div>

      <div class="control-grid">
        <div class="control-item">
          <label>일치 임계치</label>
          <input type="range" id="rng-threshold" min="0.30" max="0.95" step="0.01" value="0.70">
          <span class="val-badge" id="val-threshold">0.70</span>
        </div>
        <div class="control-item">
          <label>정지 감지 감도</label>
          <input type="range" id="rng-stop-thresh" min="0.5" max="10.0" step="0.5" value="2.5">
          <span class="val-badge" id="val-stop-thresh">2.5</span>
        </div>
        <div class="control-item">
          <label>그리드 시작 X</label>
          <input type="range" id="rng-grid-x" min="0" max="600" step="5" value="45">
          <span class="val-badge" id="val-grid-x">45px</span>
        </div>
        <div class="control-item">
          <label>그리드 시작 Y</label>
          <input type="range" id="rng-grid-y" min="0" max="400" step="5" value="85">
          <span class="val-badge" id="val-grid-y">85px</span>
        </div>
        <div class="control-item">
          <label>셀 가로(W)</label>
          <input type="range" id="rng-cell-w" min="20" max="100" step="2" value="54">
          <span class="val-badge" id="val-cell-w">54px</span>
        </div>
        <div class="control-item">
          <label>셀 세로(H)</label>
          <input type="range" id="rng-cell-h" min="20" max="120" step="2" value="75">
          <span class="val-badge" id="val-cell-h">75px</span>
        </div>
        <div class="control-item">
          <label>셀 간격(Gap)</label>
          <input type="range" id="rng-gap" min="0" max="10" step="1" value="1">
          <span class="val-badge" id="val-gap">1px</span>
        </div>
        <div class="control-item">
          <label>정상 샘플 셀</label>
          <input type="range" id="rng-sample-idx" min="1" max="30" step="1" value="1">
          <span class="val-badge" id="val-sample-idx">1번(1,1)</span>
        </div>
      </div>

      <button id="btn-save-settings" style="margin-top:10px; background:var(--accent);">설정 완료 및 닫기</button>
    </div>
  </div>

  <!-- 비동기 OpenCV.js 로드 -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" onerror="onOpenCvError();"></script>

  <script>
    // --- 1. DOM 요소 및 기본 상태 ---
    const viewport = document.getElementById('viewport');
    const videoWrapper = document.getElementById('video-wrapper');
    const webcam = document.getElementById('webcam');
    const simCanvas = document.getElementById('sim-canvas');
    const simCtx = simCanvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const thumbCanvas = document.getElementById('thumb-canvas');
    const thumbCtx = thumbCanvas.getContext('2d');

    const cvBadge = document.getElementById('cv-status');
    const cvText = document.getElementById('cv-text');
    const stateBadge = document.getElementById('state-badge');
    const stateText = document.getElementById('state-text');
    const thumbStatus = document.getElementById('thumb-status');
    const alarmBanner = document.getElementById('alarm-banner');
    const alarmDetail = document.getElementById('alarm-detail');
    const btnDismissAlarm = document.getElementById('btn-dismiss-alarm');

    const txtMotion = document.getElementById('txt-motion');
    const txtInspectResult = document.getElementById('txt-inspect-result');
    const txtMinScore = document.getElementById('txt-min-score');

    // 모달 설정
    const settingsModal = document.getElementById('settings-modal');
    const btnOpenSettings = document.getElementById('btn-open-settings');
    const btnCloseSettings = document.getElementById('btn-close-settings');
    const btnSaveSettings = document.getElementById('btn-save-settings');

    btnOpenSettings.onclick = () => settingsModal.style.display = 'flex';
    btnCloseSettings.onclick = () => settingsModal.style.display = 'none';
    btnSaveSettings.onclick = () => settingsModal.style.display = 'none';

    const rngThreshold = document.getElementById('rng-threshold'), valThreshold = document.getElementById('val-threshold');
    const rngStopThresh = document.getElementById('rng-stop-thresh'), valStopThresh = document.getElementById('val-stop-thresh');
    const rngGridX = document.getElementById('rng-grid-x'), valGridX = document.getElementById('val-grid-x');
    const rngGridY = document.getElementById('rng-grid-y'), valGridY = document.getElementById('val-grid-y');
    const rngCellW = document.getElementById('rng-cell-w'), valCellW = document.getElementById('val-cell-w');
    const rngCellH = document.getElementById('rng-cell-h'), valCellH = document.getElementById('val-cell-h');
    const rngGap = document.getElementById('rng-gap'), valGap = document.getElementById('val-gap');
    const rngSampleIdx = document.getElementById('rng-sample-idx'), valSampleIdx = document.getElementById('val-sample-idx');

    const btnSimMode = document.getElementById('btn-sim-mode');
    const btnCaptureTemplate = document.getElementById('btn-capture-template');
    const btnInspectNow = document.getElementById('btn-inspect-now');
    const btnToggleRun = document.getElementById('btn-toggle-run');

    // 내부 작업용 숨김 캔버스
    const workCanvas = document.createElement('canvas');
    const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });

    // 시스템 파라미터 (가로 와이드 및 1px 초밀착 간격)
    const ROWS = 3;
    const COLS = 10;
    let gridX = 45, gridY = 85, cellW = 54, cellH = 75, cellGap = 1;
    let matchThreshold = 0.70;
    let stopThreshold = 2.5;
    let sampleCellIndex = 0; // 0-based: 0 ~ 29

    // OpenCV 상태 및 템플릿
    let isOpenCvReady = false;
    let normalTemplateMat = null; // cv.Mat (Grayscale)
    let audioCtx = null;
    let isRunning = false;
    let isSimulationMode = false;

    // 상태 머신: 'IDLE' | 'WAIT_ARRIVAL' | 'CHECK_STOP' | 'INSPECT_ONESHOT' | 'WAIT_DEPARTURE'
    let state = 'IDLE';
    let prevTriggerPixels = null;
    let stableStopCount = 0;
    let lastInspectionResults = null;
    let animationFrameId = null;

    // --- 2. OpenCV 초기화 핸들러 ---
    function onOpenCvReady() {
      if (typeof cv !== 'undefined') {
        if (cv.getBuildInformation) {
          initCvSuccess();
        } else {
          cv['onRuntimeInitialized'] = initCvSuccess;
        }
      }
    }
    function initCvSuccess() {
      isOpenCvReady = true;
      cvBadge.className = 'cv-badge ready';
      cvText.textContent = 'OpenCV 준비 완료';
      btnCaptureTemplate.disabled = false;
      btnInspectNow.disabled = false;
      btnToggleRun.disabled = false;
    }
    function onOpenCvError() {
      cvText.textContent = 'OpenCV 로드 실패';
      cvBadge.style.color = '#ff3b30';
    }

    // --- 3. Web Audio API 사운드 알람 & 화면 회전 요청 ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }
    function playBeepAlarm() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.warn('Audio play failed:', e);
      }
    }

    // --- 4. 슬라이더 이벤트 연동 ---
    rngThreshold.oninput = () => { matchThreshold = parseFloat(rngThreshold.value); valThreshold.textContent = matchThreshold.toFixed(2); };
    rngStopThresh.oninput = () => { stopThreshold = parseFloat(rngStopThresh.value); valStopThresh.textContent = stopThreshold.toFixed(1); };
    rngGridX.oninput = () => { gridX = parseInt(rngGridX.value, 10); valGridX.textContent = gridX + 'px'; };
    rngGridY.oninput = () => { gridY = parseInt(rngGridY.value, 10); valGridY.textContent = gridY + 'px'; };
    rngCellW.oninput = () => { cellW = parseInt(rngCellW.value, 10); valCellW.textContent = cellW + 'px'; };
    rngCellH.oninput = () => { cellH = parseInt(rngCellH.value, 10); valCellH.textContent = cellH + 'px'; };
    rngGap.oninput = () => { cellGap = parseInt(rngGap.value, 10); valGap.textContent = cellGap + 'px'; };
    rngSampleIdx.oninput = () => {
      const idx = parseInt(rngSampleIdx.value, 10);
      sampleCellIndex = idx - 1;
      const r = Math.floor(sampleCellIndex / COLS) + 1;
      const c = (sampleCellIndex % COLS) + 1;
      valSampleIdx.textContent = `${idx}번(${r},${c})`;
    };

    // --- 5. 뷰포트 레이아웃 1:1 완벽 정합 엔진 ---
    function updateVideoWrapperLayout() {
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      if (!vpW || !vpH) return;

      const vidW = webcam.videoWidth || (isSimulationMode ? 640 : 640);
      const vidH = webcam.videoHeight || (isSimulationMode ? 480 : 480);
      const vidRatio = vidW / vidH;
      const vpRatio = vpW / vpH;

      let targetW, targetH;
      if (vpRatio > vidRatio) {
        targetH = vpH;
        targetW = Math.round(vpH * vidRatio);
      } else {
        targetW = vpW;
        targetH = Math.round(vpW / vidRatio);
      }

      videoWrapper.style.width = targetW + 'px';
      videoWrapper.style.height = targetH + 'px';

      overlayCanvas.width = vidW;
      overlayCanvas.height = vidH;
      simCanvas.width = vidW;
      simCanvas.height = vidH;
      workCanvas.width = vidW;
      workCanvas.height = vidH;

      rngGridX.max = Math.max(10, vidW - 100);
      rngGridY.max = Math.max(10, vidH - 80);
    }

    function initCamera() {
      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: { ideal: 1280, min: 640 },
          height: { ideal: 720, min: 480 },
          aspectRatio: { ideal: 1.7777777778 }
        }
      }).then(stream => {
        webcam.srcObject = stream;
        webcam.onloadedmetadata = () => {
          updateVideoWrapperLayout();
        };
      }).catch(err => {
        console.warn('카메라 스트림 획득 불가 -> 시뮬레이션 모드 추천', err);
        setSimulationMode(true);
      });
    }

    window.addEventListener('resize', updateVideoWrapperLayout);
    window.addEventListener('orientationchange', () => setTimeout(updateVideoWrapperLayout, 200));

    // --- 6. 가상 컨베이어 시뮬레이션 엔진 ---
    let simBoxPosX = 45;
    let simSpeed = 3.5;
    let simStopTimer = 180;
    let simHasTiltDefect = true;

    function renderSimulationFrame() {
      const w = simCanvas.width || 640;
      const h = simCanvas.height || 480;
      simCtx.fillStyle = '#181b22';
      simCtx.fillRect(0, 0, w, h);

      simCtx.strokeStyle = '#272b38';
      simCtx.lineWidth = 3;
      simCtx.beginPath();
      simCtx.moveTo(0, gridY - 20); simCtx.lineTo(w, gridY - 20);
      simCtx.moveTo(0, gridY + (cellH + cellGap) * ROWS + 20); simCtx.lineTo(w, gridY + (cellH + cellGap) * ROWS + 20);
      simCtx.stroke();

      const targetStopX = gridX;
      if (simBoxPosX < targetStopX) {
        simBoxPosX += simSpeed;
        if (simBoxPosX >= targetStopX) {
          simBoxPosX = targetStopX;
          simStopTimer = 160;
        }
      } else if (simStopTimer > 0) {
        simStopTimer--;
      } else {
        simBoxPosX += simSpeed;
        if (simBoxPosX > w + 100) {
          simBoxPosX = -((cellW + cellGap) * COLS + 60);
          simHasTiltDefect = Math.random() > 0.3;
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const bx = simBoxPosX + c * (cellW + cellGap);
          const by = gridY + r * (cellH + cellGap);
          const isDefectCell = simHasTiltDefect && ((r === 1 && c === 4) || (r === 2 && c === 7));

          if (isDefectCell) {
            simCtx.fillStyle = '#b58900';
            simCtx.fillRect(bx, by, cellW, cellH);
            simCtx.fillStyle = '#d33682';
            simCtx.fillRect(bx + 4, by + cellH / 2 - 4, cellW - 8, 8);
          } else {
            simCtx.fillStyle = '#e4e7eb';
            simCtx.fillRect(bx, by, cellW, cellH);
            simCtx.fillStyle = '#268bd2';
            simCtx.beginPath();
            simCtx.arc(bx + cellW / 2, by + cellH / 2, Math.min(cellW, cellH) * 0.25, 0, Math.PI * 2);
            simCtx.fill();
          }
          simCtx.strokeStyle = '#555';
          simCtx.lineWidth = 1;
          simCtx.strokeRect(bx, by, cellW, cellH);
        }
      }
    }

    function setSimulationMode(enable) {
      isSimulationMode = enable;
      if (enable) {
        btnSimMode.classList.add('active');
        btnSimMode.textContent = '🎮 시뮬레이션 ON';
        simCanvas.style.display = 'block';
        webcam.style.display = 'none';
        simBoxPosX = gridX;
        simStopTimer = 300;
        updateVideoWrapperLayout();
      } else {
        btnSimMode.classList.remove('active');
        btnSimMode.textContent = '🎮 시뮬레이션';
        simCanvas.style.display = 'none';
        webcam.style.display = 'block';
        updateVideoWrapperLayout();
      }
    }
    btnSimMode.onclick = () => setSimulationMode(!isSimulationMode);

    // --- 7. 소스 프레임 캡처 도우미 ---
    function getCurrentFrameCanvas() {
      const w = overlayCanvas.width || 640;
      const h = overlayCanvas.height || 480;
      if (!isSimulationMode && webcam.videoWidth && webcam.videoHeight) {
        workCtx.drawImage(webcam, 0, 0, w, h);
        return workCanvas;
      }
      return simCanvas;
    }

    // --- 8. 정상 셀 템플릿 캡처 및 등록 ---
    btnCaptureTemplate.onclick = () => {
      initAudio();
      captureTemplate();
    };

    function captureTemplate() {
      if (!isOpenCvReady) {
        thumbStatus.textContent = 'OpenCV 대기중';
        return;
      }
      if (isSimulationMode) {
        simBoxPosX = gridX;
        renderSimulationFrame();
      }
      const srcCanvas = getCurrentFrameCanvas();
      if (!srcCanvas) {
        thumbStatus.textContent = '프레임 준비중';
        return;
      }

      const r = Math.floor(sampleCellIndex / COLS);
      const c = sampleCellIndex % COLS;
      const x = gridX + c * (cellW + cellGap);
      const y = gridY + r * (cellH + cellGap);

      const cellData = srcCanvas.getContext('2d').getImageData(x, y, cellW, cellH);

      thumbCanvas.width = cellW;
      thumbCanvas.height = cellH;
      thumbCtx.putImageData(cellData, 0, 0);
      thumbStatus.textContent = `${r+1}행${c+1}열 등록됨`;
      thumbStatus.style.color = '#34c759';

      if (normalTemplateMat) {
        normalTemplateMat.delete();
        normalTemplateMat = null;
      }
      try {
        const fullMat = cv.matFromImageData(cellData);
        normalTemplateMat = new cv.Mat();
        cv.cvtColor(fullMat, normalTemplateMat, cv.COLOR_RGBA2GRAY);
        fullMat.delete();
        console.log('템플릿 등록 완료:', cellW, cellH);
      } catch (err) {
        console.error('템플릿 생성 실패:', err);
      }
    }

    // --- 9. 자동 감시 상태 머신 (Trigger & Inspection) ---
    btnInspectNow.onclick = () => {
      initAudio();
      if (!normalTemplateMat) {
        captureTemplate();
      }
      if (isSimulationMode) {
        simBoxPosX = gridX;
        renderSimulationFrame();
      }
      const srcCanvas = getCurrentFrameCanvas();
      if (srcCanvas) {
        runOneShotInspection(srcCanvas);
      }
    };

    btnToggleRun.onclick = () => {
      initAudio();
      if (!isRunning) {
        if (!normalTemplateMat) {
          captureTemplate();
          if (!normalTemplateMat) {
            thumbStatus.textContent = '템플릿 등록 필요';
            return;
          }
        }
        startRunning();
      } else {
        stopRunning();
      }
    };

    function startRunning() {
      isRunning = true;
      state = 'WAIT_ARRIVAL';
      stableStopCount = 0;
      prevTriggerPixels = null;
      btnToggleRun.classList.add('running');
      btnToggleRun.textContent = '⏹️ 감시 정지';
      updateStateBadge('WAIT_ARRIVAL', '박스 도착 대기', '#00ffcc');

      setTimeout(() => {
        if (isRunning && (state === 'WAIT_ARRIVAL' || state === 'CHECK_STOP')) {
          const srcCanvas = getCurrentFrameCanvas();
          if (srcCanvas) runOneShotInspection(srcCanvas);
        }
      }, 400);
    }

    function stopRunning() {
      isRunning = false;
      state = 'IDLE';
      btnToggleRun.classList.remove('running');
      btnToggleRun.textContent = '▶️ 자동 감시';
      updateStateBadge('IDLE', '정지됨', '#8e8e93');
      lastInspectionResults = null;
    }

    function updateStateBadge(st, text, color) {
      state = st;
      stateText.textContent = text;
      stateBadge.querySelector('.dot').style.background = color;
    }

    function calculateTriggerMotion(srcCanvas) {
      const roiW = 50;
      const roiH = 50;
      const rx = Math.min(srcCanvas.width - roiW - 5, gridX + COLS * (cellW + cellGap) - roiW);
      const ry = gridY + Math.floor((ROWS * (cellH + cellGap) - roiH) / 2);

      const ctx = srcCanvas.getContext('2d');
      const imgData = ctx.getImageData(rx, ry, roiW, roiH);
      const data = imgData.data;

      let diffSum = 0;
      const len = data.length;
      if (!prevTriggerPixels || prevTriggerPixels.length !== len) {
        prevTriggerPixels = new Uint8Array(len);
        for (let i = 0; i < len; i++) prevTriggerPixels[i] = data[i];
        return { motion: 0, rx, ry, roiW, roiH, currentData: data };
      }

      let count = 0;
      for (let i = 0; i < len; i += 4) {
        const d = Math.abs(data[i] - prevTriggerPixels[i]) +
                  Math.abs(data[i+1] - prevTriggerPixels[i+1]) +
                  Math.abs(data[i+2] - prevTriggerPixels[i+2]);
        diffSum += d / 3;
        count++;
      }
      for (let i = 0; i < len; i++) prevTriggerPixels[i] = data[i];

      const motion = count > 0 ? (diffSum / count) : 0;
      return { motion, rx, ry, roiW, roiH, currentData: data };
    }

    // --- 10. 30개 셀 OpenCV 매칭 엔진 (cv.Mat 완벽 수거) ---
    function inspectAll30Cells(srcCanvas) {
      if (!normalTemplateMat || !isOpenCvReady) return null;

      const defects = [];
      const scores = [];
      const srcCtx = srcCanvas.getContext('2d');

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cx = gridX + c * (cellW + cellGap);
          const cy = gridY + r * (cellH + cellGap);

          const cellImgData = srcCtx.getImageData(cx, cy, cellW, cellH);

          let cellMat = null;
          let cellGray = null;
          let resultMat = null;

          try {
            cellMat = cv.matFromImageData(cellImgData);
            cellGray = new cv.Mat();
            cv.cvtColor(cellMat, cellGray, cv.COLOR_RGBA2GRAY);

            resultMat = new cv.Mat();
            cv.matchTemplate(cellGray, normalTemplateMat, resultMat, cv.TM_CCOEFF_NORMED);

            const minMax = cv.minMaxLoc(resultMat);
            const score = minMax.maxVal;
            scores.push({ r, c, score, x: cx, y: cy });

            if (score < matchThreshold) {
              defects.push({ r: r + 1, c: c + 1, score, x: cx, y: cy });
            }
          } catch (err) {
            console.error(`Cell (${r},${c}) 매칭 에러:`, err);
          } finally {
            if (cellMat) cellMat.delete();
            if (cellGray) cellGray.delete();
            if (resultMat) resultMat.delete();
          }
        }
      }

      const minScore = scores.reduce((min, s) => Math.min(min, s.score), 1.0);
      return { defects, scores, minScore };
    }

    // --- 11. 메인 프로세싱 & 렌더링 루프 ---
    function processLoop() {
      if (isSimulationMode) {
        renderSimulationFrame();
      }

      const srcCanvas = getCurrentFrameCanvas();
      const w = overlayCanvas.width || 640;
      const h = overlayCanvas.height || 480;
      overlayCtx.clearRect(0, 0, w, h);

      if (srcCanvas) {
        const { motion, rx, ry, roiW, roiH } = calculateTriggerMotion(srcCanvas);
        txtMotion.textContent = motion.toFixed(1);

        overlayCtx.strokeStyle = '#00e5ff';
        overlayCtx.setLineDash([4, 4]);
        overlayCtx.lineWidth = 1.5;
        overlayCtx.strokeRect(rx, ry, roiW, roiH);
        overlayCtx.setLineDash([]);
        overlayCtx.fillStyle = 'rgba(0, 229, 255, 0.15)';
        overlayCtx.fillRect(rx, ry, roiW, roiH);

        if (isRunning) {
          handleStateMachine(motion, srcCanvas);
        }
      }

      renderGridOverlay();
      animationFrameId = requestAnimationFrame(processLoop);
    }

    function handleStateMachine(motion, srcCanvas) {
      switch (state) {
        case 'WAIT_ARRIVAL':
          if (motion > stopThreshold * 1.5) {
            stableStopCount = 0;
            updateStateBadge('CHECK_STOP', '정지 대기중...', '#ffcc00');
          }
          break;

        case 'CHECK_STOP':
          if (motion <= stopThreshold) {
            stableStopCount++;
            if (stableStopCount >= 4) {
              updateStateBadge('INSPECT_ONESHOT', '원샷 검사중...', '#af52de');
              setTimeout(() => {
                runOneShotInspection(srcCanvas);
              }, 40);
            }
          } else {
            stableStopCount = Math.max(0, stableStopCount - 1);
          }
          break;

        case 'INSPECT_ONESHOT':
          break;

        case 'WAIT_DEPARTURE':
          if (motion > stopThreshold * 2.0) {
            stableStopCount = 0;
          } else if (stableStopCount > 20 && motion < stopThreshold) {
            lastInspectionResults = null;
            updateStateBadge('WAIT_ARRIVAL', '다음 박스 대기', '#00ffcc');
          }
          stableStopCount++;
          break;
      }
    }

    function runOneShotInspection(srcCanvas) {
      const result = inspectAll30Cells(srcCanvas);
      if (!result) {
        updateStateBadge('WAIT_DEPARTURE', '검사 오류 (미등록)', '#ff3b30');
        return;
      }

      lastInspectionResults = result;
      txtMinScore.textContent = result.minScore.toFixed(2);

      if (result.defects.length > 0) {
        txtInspectResult.textContent = `불량 ${result.defects.length}건`;
        txtInspectResult.style.color = '#ff3b30';
        triggerAlarm(result.defects);
      } else {
        txtInspectResult.textContent = '전체 정상 (PASS)';
        txtInspectResult.style.color = '#34c759';
      }

      updateStateBadge('WAIT_DEPARTURE', '검사 완료 (출발 대기)', '#ff9500');
    }

    function triggerAlarm(defects) {
      playBeepAlarm();
      const defectSummary = defects.slice(0, 3).map(d => `${d.r}행${d.c}열`).join(', ') +
                            (defects.length > 3 ? ` 외 ${defects.length - 3}건` : '');
      alarmDetail.textContent = `전도 의심 위치: ${defectSummary}`;
      alarmBanner.style.display = 'flex';
    }

    btnDismissAlarm.onclick = () => {
      alarmBanner.style.display = 'none';
    };

    // --- 12. 그리드 오버레이 렌더링 ---
    function renderGridOverlay() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = gridX + c * (cellW + cellGap);
          const y = gridY + r * (cellH + cellGap);
          const cellIndex = r * COLS + c;

          let strokeColor = 'rgba(255, 255, 255, 0.4)';
          let fillColor = 'transparent';
          let textColor = '#888';
          let scoreText = '';

          if (lastInspectionResults) {
            const defect = lastInspectionResults.defects.find(d => d.r === (r + 1) && d.c === (c + 1));
            const scoreItem = lastInspectionResults.scores.find(s => s.r === r && s.c === c);

            if (defect) {
              strokeColor = '#ff3b30';
              fillColor = 'rgba(255, 59, 48, 0.45)';
              textColor = '#ff3b30';
              scoreText = `${(defect.score * 100).toFixed(0)}%`;
            } else {
              strokeColor = '#34c759';
              fillColor = 'rgba(52, 199, 89, 0.12)';
              textColor = '#34c759';
              if (scoreItem) scoreText = `${(scoreItem.score * 100).toFixed(0)}%`;
            }
          } else if (cellIndex === sampleCellIndex) {
            strokeColor = '#ff9500';
            fillColor = 'rgba(255, 149, 0, 0.2)';
            textColor = '#ff9500';
            scoreText = '기준';
          }

          overlayCtx.strokeStyle = strokeColor;
          overlayCtx.lineWidth = (strokeColor === '#ff3b30') ? 3 : 1.5;
          overlayCtx.strokeRect(x, y, cellW, cellH);

          if (fillColor !== 'transparent') {
            overlayCtx.fillStyle = fillColor;
            overlayCtx.fillRect(x, y, cellW, cellH);
          }

          overlayCtx.fillStyle = textColor;
          overlayCtx.font = 'bold 9px monospace';
          overlayCtx.fillText(`${r+1}-${c+1}`, x + 3, y + 10);

          if (scoreText) {
            overlayCtx.font = 'bold 10px monospace';
            overlayCtx.fillText(scoreText, x + 3, y + cellH - 4);
          }
        }
      }
    }

    // --- 초기 기동 ---
    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
      updateVideoWrapperLayout();
      processLoop();
    });
  </script>
</body>
</html>
